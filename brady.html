<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capitano Brady · Eventi KEIK Modena</title>
<meta name="description" content="Chiedi al Capitano Brady date, orari e prezzi degli eventi di KEIK in Via Canalino 51, e prenota il tuo posto.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="KEIK">
<meta property="og:title" content="Capitano Brady · Eventi KEIK Modena">
<meta property="og:description" content="Date, orari e prezzi degli eventi del mese, e il link giusto per prenotare.">
<meta property="og:image" content="https://keik.it/assets/img/brady-capitano.jpg">
<meta property="og:url" content="https://keik.it/brady.html">
<link rel="icon" type="image/png" href="assets/img/cab2c85a72f518cbd8df0064e68be490.png">
<link rel="preload" href="assets/fonts/montserrat-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
/* Chat chiara: fondo crema, bolle viola. Pensata prima per il telefono. */
:root{
  --cream:#F7F1EA; --card:#FFFFFF; --line:#E6DAD7;
  --violet:#580259; --violet-soft:#EFE3F1; --fucsia:#A6038B;
  --ink:#2A0830; --muted:#8A7590;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--cream);color:var(--ink);font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:focus-visible{outline:2px solid var(--fucsia);outline-offset:2px}
.b-app{height:100%;max-width:640px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;
  padding:0 max(14px,env(safe-area-inset-right,0px)) 6px max(14px,env(safe-area-inset-left,0px))}
.b-top{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.b-back{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:999px;color:var(--violet);text-decoration:none;font-size:20px;flex-shrink:0}
.b-back:hover{background:var(--violet-soft)}
.b-avatar{width:42px;height:42px;border-radius:50%;flex-shrink:0;display:block}
.b-top h1{margin:0;font-family:'Big Shoulders Display','Montserrat',sans-serif;font-weight:800;font-size:26px;line-height:1;letter-spacing:.02em;text-transform:uppercase;color:var(--violet)}
.b-log{min-height:0;overflow:auto;padding:16px 0 12px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.b-log>*{flex-shrink:0}
.b-row{display:flex;align-items:flex-end;gap:8px;align-self:flex-start;max-width:86%}
.b-face{width:30px;height:30px;border-radius:50%;flex-shrink:0}
.b-msg{padding:10px 14px;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.b-bot{background:var(--violet);color:#FFFFFF;border-radius:18px 18px 18px 6px}
.b-bot a{color:#F6C9EE}
.b-me{align-self:flex-end;max-width:80%;background:var(--violet-soft);color:var(--violet);border-radius:18px 18px 6px 18px;font-weight:600}
.b-dots{display:inline-flex;gap:5px;padding:4px 2px}
.b-dots i{width:7px;height:7px;border-radius:50%;background:#FFFFFF;opacity:.4;animation:b-dot 1.2s infinite}
.b-dots i:nth-child(2){animation-delay:.2s}.b-dots i:nth-child(3){animation-delay:.4s}
@keyframes b-dot{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.b-chips{display:none}
.b-form{display:flex;align-items:center;gap:8px;padding:8px 0 6px;border-top:1px solid var(--line)}
.b-form input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);padding:12px 16px;border-radius:999px}
.b-form input::placeholder{color:var(--muted)}
.b-form input:focus,.b-form input:focus-visible{outline:none;border-color:var(--violet)}
.b-send{flex-shrink:0;width:46px;height:46px;border-radius:50%;border:0;background:var(--violet);color:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer}
.b-send:disabled{opacity:.45;cursor:default}
.b-send svg{width:20px;height:20px}
.b-foot{margin:0;font-size:10.5px;line-height:1.3;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-foot a{color:var(--muted)}
.b-ticket{align-self:flex-start;margin-left:38px;width:min(calc(100% - 38px),400px);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;overflow:hidden;font-variant-numeric:tabular-nums}
.b-band{background:var(--violet);color:#fff;display:flex;justify-content:space-between;gap:10px;padding:7px 14px;font-family:'Space Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
.b-band b{font-weight:700}
.b-body{padding:14px;display:grid;gap:12px}
.b-body h3{margin:0;font-family:'Big Shoulders Display','Montserrat',sans-serif;font-weight:800;font-size:26px;line-height:1;color:var(--violet)}
.b-when{margin:-6px 0 0;font-size:13px;color:var(--muted)}
.b-fields{display:flex;flex-wrap:wrap;gap:12px 20px}
.b-field{display:flex;flex-direction:column;gap:4px;min-width:0}
.b-field>span{font-family:'Space Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fucsia)}
.b-field strong{font-size:14px}
.b-field select,.b-field input{font:inherit;font-weight:600;font-size:14px;color:var(--ink);background:var(--cream);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.b-seg{display:flex;gap:6px}
.b-seg button,.b-step button{font:inherit;font-weight:700;font-size:14px;border:1.5px solid var(--violet);background:transparent;color:var(--violet);border-radius:8px;padding:4px 10px;cursor:pointer}
.b-seg button[aria-pressed=true]{background:var(--violet);color:#fff}
.b-step{display:flex;align-items:center;gap:8px}
.b-step output{min-width:2ch;text-align:center;font-weight:800;font-size:16px}
.b-ctas{display:grid;gap:8px}
.b-cta,.b-cta2{display:flex;justify-content:center;align-items:center;min-height:46px;text-decoration:none;font-weight:700;font-size:15px;border-radius:999px;padding:0 16px}
.b-cta{background:var(--fucsia);color:#fff}
.b-cta:hover{background:var(--violet)}
.b-cta2{border:1.5px solid var(--violet);color:var(--violet)}
.b-small{margin:0;font-size:11.5px;line-height:1.4;color:var(--muted)}
@media (max-width:420px){ .b-ticket{margin-left:0;width:100%} }
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.b-dots i{animation:none;opacity:.8}}
</style>
</head>
<body>
<div class="b-app">
  <header class="b-top">
    <a class="b-back" href="eventi.html" aria-label="Eventi di KEIK">←</a>
    <img class="b-avatar" src="assets/img/brady-capitano-256.webp" alt="Il Capitano Brady, il bradipo di KEIK" width="42" height="42">
    <h1>Capitano Brady</h1>
  </header>
  <main class="b-log" id="b-log" aria-live="polite" aria-label="Chat con il Capitano Brady"></main>
  <div class="b-chips" id="b-chips"></div>
  <div>
    <form class="b-form" id="b-form" autocomplete="off">
      <label for="b-msg" hidden>Scrivi al Capitano Brady</label>
      <input id="b-msg" name="msg" maxlength="600" enterkeyhint="send" placeholder="Scrivi a Brady…">
      <button class="b-send" id="b-send" type="submit" aria-label="Invia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </form>
    <p class="b-foot">Risposte con AI · allergie: chiedi allo staff · <a href="https://www.iubenda.com/privacy-policy/680124" target="_blank" rel="noopener">Privacy</a></p>
  </div>
</div>
<script src="assets/js/brady.js?v=5"></script>
</body>
</html>
