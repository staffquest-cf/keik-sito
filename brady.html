<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capitano Brady · Eventi KEIK Modena</title>
<meta name="description" content="Chiedi al Capitano Brady date, orari e prezzi degli eventi di KEIK in Via Canalino 51, e prenota il tuo posto.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="KEIK">
<meta property="og:title" content="Capitano Brady · Eventi KEIK Modena">
<meta property="og:description" content="Date, orari e prezzi degli eventi del mese, e il link giusto per prenotare.">
<meta property="og:image" content="https://keik.it/assets/img/brady-capitano.jpg">
<meta property="og:url" content="https://keik.it/brady.html">
<link rel="canonical" href="https://keik.it/brady.html">
<link rel="icon" type="image/png" href="assets/img/cab2c85a72f518cbd8df0064e68be490.png">
<link rel="preload" href="assets/fonts/montserrat-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
:root{
  --bg:#2A0830; --panel:#35103C; --raise:#45174D; --line:#5A2E62;
  --fg:#FFFFFF; --soft:#E4D3E5; --muted:#B99BBC; --pink:#E9A9DF; --fucsia:#91007D;
  --yellow:#F2E205; --cream:#F7F1EA; --ink:#2A0830;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.b-app{height:100%;max-width:820px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);
  padding:0 max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
.b-top{display:flex;align-items:center;gap:14px;padding:14px 0 12px;border-bottom:1.5px solid rgba(255,255,255,.5)}
.b-back{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:999px;color:var(--soft);text-decoration:none;font-size:22px;flex-shrink:0}
.b-back:hover{background:var(--panel);color:var(--fg)}
.b-avatar{width:60px;height:60px;border-radius:50%;flex-shrink:0;display:block}
.b-top h1{margin:0;font-family:'Big Shoulders Display','Montserrat',sans-serif;font-weight:800;font-size:34px;line-height:1;letter-spacing:.01em;text-transform:uppercase}
.b-chat{margin-top:14px;display:flex;flex-direction:column;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.b-log{flex:1;min-height:0;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.b-log>*{flex-shrink:0}
.b-row{display:flex;align-items:flex-end;gap:8px;align-self:flex-start;max-width:min(88%,600px)}
.b-face{width:36px;height:36px;border-radius:50%;flex-shrink:0}
.b-msg{padding:10px 14px;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.b-msg a{color:var(--pink)}
.b-bot{background:var(--raise);border-radius:16px 16px 16px 4px}
.b-me{align-self:flex-end;max-width:min(82%,520px);background:var(--fucsia);border-radius:16px 16px 4px 16px;font-weight:600}
.b-thinking .b-bot{color:var(--muted);font-style:italic}
.b-chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 12px}
.b-chips:empty{display:none}
.b-chip{font:inherit;font-size:13px;font-weight:600;padding:7px 13px;background:transparent;border:1.5px solid var(--pink);color:var(--pink);border-radius:999px;cursor:pointer}
.b-chip:hover{background:var(--pink);color:var(--ink)}
.b-form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.b-form input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);padding:12px 16px;border-radius:999px}
.b-form input::placeholder{color:var(--muted)}
.b-send{font:inherit;font-weight:700;font-size:15px;background:var(--fg);color:var(--ink);border:0;border-radius:999px;padding:0 22px;cursor:pointer;min-height:48px}
.b-send:disabled{opacity:.5;cursor:default}
.b-foot{margin:0;padding:0 16px 12px;font-size:11.5px;line-height:1.5;color:var(--muted)}
.b-foot a{color:var(--muted)}
.b-ticket{align-self:flex-start;margin-left:44px;width:min(calc(100% - 44px),440px);background:var(--cream);color:var(--ink);border-radius:14px;overflow:hidden;font-variant-numeric:tabular-nums}
.b-band{background:var(--fucsia);color:#fff;display:flex;justify-content:space-between;gap:10px;padding:8px 14px;font-family:'Space Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.b-band b{font-weight:700}
.b-body{padding:14px;display:grid;gap:12px}
.b-body h3{margin:0;font-family:'Big Shoulders Display','Montserrat',sans-serif;font-weight:800;font-size:28px;line-height:1}
.b-when{margin:-6px 0 0;font-size:13px;color:#5A3D60}
.b-fields{display:flex;flex-wrap:wrap;gap:14px 22px}
.b-field{display:flex;flex-direction:column;gap:4px;min-width:0}
.b-field>span{font-family:'Space Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fucsia)}
.b-field strong{font-size:15px}
.b-field select,.b-field input{font:inherit;font-weight:600;font-size:14px;color:var(--ink);background:#fff;border:1px solid #D7C6D8;border-radius:8px;padding:6px 8px;color-scheme:light}
.b-seg{display:flex;gap:6px}
.b-seg button,.b-step button{font:inherit;font-weight:700;font-size:14px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer}
.b-seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.b-step{display:flex;align-items:center;gap:8px}
.b-step output{min-width:2ch;text-align:center;font-weight:800;font-size:17px}
.b-ctas{display:grid;gap:8px}
.b-cta,.b-cta2{display:flex;justify-content:center;align-items:center;min-height:48px;text-decoration:none;font-weight:700;font-size:15px;border-radius:999px;padding:0 16px}
.b-cta{background:var(--fucsia);color:#fff}
.b-cta:hover{background:var(--ink)}
.b-cta2{border:1.5px solid var(--ink);color:var(--ink)}
.b-small{margin:0;font-size:12px;line-height:1.45;color:#5A3D60}
@media (max-width:520px){
  .b-top h1{font-size:28px}
  .b-avatar{width:50px;height:50px}
  .b-back{width:32px}
  .b-log{padding:14px 12px}
  .b-chips{padding:0 12px 10px}
  .b-ticket{margin-left:0;width:100%}
  .b-chat{border-radius:16px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="b-app">
  <header class="b-top">
    <a class="b-back" href="eventi.html" aria-label="Torna agli eventi">←</a>
    <img class="b-avatar" src="assets/img/brady-capitano-256.webp" alt="Il Capitano Brady, il bradipo di KEIK" width="60" height="60">
    <h1>Capitano Brady</h1>
  </header>
  <main class="b-chat" aria-label="Chat con il Capitano Brady">
    <div class="b-log" id="b-log" aria-live="polite"></div>
    <div class="b-chips" id="b-chips"></div>
    <form class="b-form" id="b-form" autocomplete="off">
      <label for="b-msg" hidden>Scrivi al Capitano Brady</label>
      <input id="b-msg" name="msg" maxlength="600" enterkeyhint="send" placeholder="Chiedi date, orari, prezzi… o cosa vuoi prenotare">
      <button class="b-send" id="b-send" type="submit">Invia</button>
    </form>
    <p class="b-foot">Brady risponde con l'intelligenza artificiale usando le informazioni di keik.it: per allergie e casi particolari chiedi sempre allo staff. Non salviamo le conversazioni. <a href="https://www.iubenda.com/privacy-policy/680124" target="_blank" rel="noopener">Privacy</a></p>
  </main>
</div>
<script src="assets/js/brady.js?v=1"></script>
</body>
</html>
